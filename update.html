<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122e29">
  <title>聚宝山盆 · 更新修复</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,#2c5949,#0d2922 72%);color:#f5e7bf;font-family:system-ui,sans-serif}.card{width:min(440px,100%);padding:25px;border:2px solid #d9bf7d;border-radius:14px;background:#123a30;box-shadow:0 18px 70px #0009;text-align:center}.seal{font-size:44px}.card h1{margin:6px 0 12px;color:#f0d691}.card p{line-height:1.75;color:#d2ddd2}.card button,.card a{display:block;width:100%;min-height:48px;margin-top:12px;padding:12px;border:1px solid #d9bf7d;border-radius:8px;background:#d9bf7d;color:#17382f;font:inherit;font-weight:700;text-decoration:none}.card a{background:#294f40;color:#fff0c8}.status{min-height:26px;color:#f0d691;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="seal" aria-hidden="true">◈</div>
    <h1>更新修复</h1>
    <p>用于旧版黑屏或更新按钮无法显示。点击后只切换游戏程序版本，不清除本地存档。</p>
    <p id="status" class="status">正在检查新版……</p>
    <button id="update" disabled>保存并更新</button>
    <a href="./">返回游戏</a>
  </main>
  <script>
    (async()=>{
      const button=document.querySelector('#update'),status=document.querySelector('#status');
      if(!('serviceWorker'in navigator)){status.textContent='当前浏览器不支持离线更新，请返回游戏并刷新。';return}
      let registration=await navigator.serviceWorker.getRegistration('./');
      if(!registration)registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
      const show=()=>{if(registration.waiting){button.disabled=false;status.textContent='新版已经准备好，可以安全更新。';return true}return false};
      if(!show()){
        await registration.update().catch(()=>{});
        if(!show())status.textContent='正在下载新版，请稍候……';
        registration.addEventListener('updatefound',()=>{
          const worker=registration.installing;
          worker?.addEventListener('statechange',()=>{if(worker.state==='installed')show()});
        });
      }
      button.addEventListener('click',()=>{
        if(!registration.waiting)return;
        button.disabled=true;status.textContent='正在切换新版……';
        let changed=false;
        navigator.serviceWorker.addEventListener('controllerchange',()=>{if(changed)return;changed=true;location.replace('./?updated='+Date.now())});
        registration.waiting.postMessage({type:'SKIP_WAITING'});
      });
    })().catch(()=>{document.querySelector('#status').textContent='检查失败，请保持联网后重新打开本页。'});
  </script>
</body>
</html>
